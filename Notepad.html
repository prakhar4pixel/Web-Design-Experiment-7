<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notepad</title>
<link href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@400;600&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #ffffff;
    color: #2c2a25;
    font-family: 'Lora', Georgia, serif;
    min-height: 100vh;
  }

  .page {
    max-width: 680px;
    margin: 0 auto;
    padding: 3rem 1.5rem 5rem;
  }

  h1 {
    font-size: 1.35rem;
    font-weight: 500;
    letter-spacing: 0.01em;
    margin-bottom: 2rem;
    padding-bottom: 0.5rem;
    border-bottom: 1.5px solid currentColor;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }

  .meta {
    font-family: 'Inconsolata', monospace;
    font-size: 0.75rem;
    color: #888070;
    font-weight: 400;
  }

  form {
    background: #fffdf5;
    border: 1px solid #e0d8c4;
    padding: 1rem;
    margin-bottom: 2.5rem;
  }

  input, textarea {
    display: block;
    width: 100%;
    font-family: inherit;
    font-size: 1rem;
    background: transparent;
    border: none;
    border-bottom: 1px solid #ccc3a8;
    color: inherit;
    padding: 0.3rem 0;
    resize: vertical;
  }

  input { margin-bottom: 0.7rem; }
  textarea { min-height: 60px; margin-bottom: 0.9rem; }

  input:focus, textarea:focus {
    outline: none;
    border-bottom-color: #8b3a2a;
  }

  input::placeholder, textarea::placeholder {
    color: #aaa090;
    font-style: italic;
  }

  .btns {
    display: flex;
    gap: 0.5rem;
    justify-content: flex-end;
  }

  button {
    font-family: 'Inconsolata', monospace;
    font-size: 0.78rem;
    border: 1px solid #2c2a25;
    background: transparent;
    color: inherit;
    padding: 0.4rem 0.85rem;
    cursor: pointer;
    letter-spacing: 0.02em;
  }

  button.add {
    background: #2c2a25;
    color: #f5eedf;
  }

  button:hover { opacity: 0.65; }

  button.cancel {
    border-color: transparent;
    color: #888070;
  }

  ul { list-style: none; }

  .note {
    padding: 0.85rem 0;
    border-bottom: 1px dashed #ccc3a8;
    position: relative;
    padding-left: 0.9rem;
  }

  .note.editing::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0.85rem;
    bottom: 0.85rem;
    width: 2px;
    background: #8b3a2a;
  }

  .note-title {
    font-weight: 500;
    font-size: 1rem;
    margin-bottom: 0.15rem;
  }

  .note-body {
    font-size: 0.92rem;
    color: #6b6050;
    white-space: pre-wrap;
    line-height: 1.55;
    margin-bottom: 0.5rem;
  }

  .note-actions {
    font-family: 'Inconsolata', monospace;
    font-size: 0.72rem;
    display: flex;
    gap: 1rem;
  }

  .note-actions span {
    cursor: pointer;
    color: #aaa090;
    text-decoration: underline;
    text-underline-offset: 2px;
  }

  .note-actions span:hover { color: #8b3a2a; }

  .empty {
    text-align: center;
    padding: 2rem;
    color: #aaa090;
    font-style: italic;
    border: 1px dashed #ccc3a8;
    font-size: 0.95rem;
  }

  @media (max-width: 480px) {
    .page { padding: 1.75rem 1rem 4rem; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,5); }

const seed = [];

function App() {
  const [notes, setNotes] = useState(seed);
  const [title, setTitle] = useState("");
  const [body, setBody] = useState("");
  const [editId, setEditId] = useState(null);

  function reset() { setTitle(""); setBody(""); setEditId(null); }

  function submit(e) {
    e.preventDefault();
    const t = title.trim();
    if (!t) return;
    if (editId) {
      setNotes(notes.map(n => n.id === editId ? { ...n, title: t, body: body.trim() } : n));
    } else {
      setNotes([{ id: uid(), title: t, body: body.trim() }, ...notes]);
    }
    reset();
  }

  function edit(note) { setEditId(note.id); setTitle(note.title); setBody(note.body); }
  function del(id) { setNotes(notes.filter(n => n.id !== id)); if (editId === id) reset(); }

  return (
    <div className="page">
      <h1>
        Notepad
        <span className="meta">{notes.length} {notes.length === 1 ? "note" : "notes"}</span>
      </h1>

      <form onSubmit={submit}>
        <input
          placeholder="Title"
          value={title}
          onChange={e => setTitle(e.target.value)}
        />
        <textarea
          placeholder="Write something..."
          rows="2"
          value={body}
          onChange={e => setBody(e.target.value)}
        />
        <div className="btns">
          {editId && <button type="button" className="cancel" onClick={reset}>cancel</button>}
          <button type="submit" className="add">{editId ? "save" : "add"}</button>
        </div>
      </form>

      {notes.length === 0
        ? null
        : <ul>
            {notes.map(n => (
              <li key={n.id} className={"note" + (n.id === editId ? " editing" : "")}>
                <p className="note-title">{n.title}</p>
                {n.body && <p className="note-body">{n.body}</p>}
                <div className="note-actions">
                  <span onClick={() => edit(n)}>edit</span>
                  <span onClick={() => del(n.id)}>delete</span>
                </div>
              </li>
            ))}
          </ul>
      }
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
